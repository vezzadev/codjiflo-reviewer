name: Codjiflo Reviewer
run-name: Review ${{ inputs.repository }} comment ${{ inputs.comment-id }}${{ inputs.redispatch-of && format(' (retry of run {0})', inputs.redispatch-of) || '' }}
# The webhook relay dispatches one run per mention in any repository the App
# is installed on. Inputs only locate the comment; the gate re-reads it.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: owner/repo containing the pull request comment
        type: string
        required: true
      comment-id:
        description: Issue comment ID of the review mention
        type: string
        required: true
      redispatch-of:
        description: Run ID whose review runner was lost; set only by the automatic retry
        type: string
        required: false
        default: ''
permissions:
  actions: read
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      provider: ${{ steps.gate.outputs.provider }}
      number: ${{ steps.gate.outputs.number }}
      visibility: ${{ steps.gate.outputs.visibility }}
      prepare-command: ${{ steps.gate.outputs.prepare-command }}
      source-submodules: ${{ steps.gate.outputs.source-submodules }}
      owner: ${{ steps.target.outputs.owner }}
      name: ${{ steps.target.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve target repository
        id: target
        shell: bash
        env:
          REPOSITORY: ${{ inputs.repository }}
        run: |
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::repository must be owner/repo"; exit 1; }
          echo "owner=${REPOSITORY%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
      - name: Mint GitHub App installation token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODJIFLO_APP_ID }}
          private-key: ${{ secrets.CODJIFLO_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-issues: read
          permission-pull-requests: write
          permission-metadata: read
      - id: gate
        run: node bin/codjiflo-reviewer.mjs --gate --repo "$REPOSITORY" --comment "$COMMENT_ID"
        env:
          REPOSITORY: ${{ inputs.repository }}
          COMMENT_ID: ${{ inputs.comment-id }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          CODJIFLO_APPROVED_USERS: ${{ vars.CODJIFLO_APPROVED_USERS }}
          CODJIFLO_REDISPATCH_OF: ${{ inputs.redispatch-of }}
  review:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: codjiflo-reviewer
    concurrency:
      group: codjiflo-${{ inputs.repository }}-${{ needs.gate.outputs.number }}
      cancel-in-progress: false
    timeout-minutes: 55
    steps:
      # The bot implementation is this repository's revision, never the PR branch.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mint GitHub App installation token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODJIFLO_APP_ID }}
          private-key: ${{ secrets.CODJIFLO_APP_PRIVATE_KEY }}
          owner: ${{ needs.gate.outputs.owner }}
          repositories: ${{ needs.gate.outputs.name }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: write
      - name: Prepare review prerequisites
        id: prepare
        if: needs.gate.outputs.prepare-command != ''
        timeout-minutes: 5
        shell: bash
        # Trusted: comes from repositories.json in this checkout.
        run: ${{ needs.gate.outputs.prepare-command }}
      - name: Report preparation failure
        if: failure() && steps.prepare.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_PR: ${{ needs.gate.outputs.number }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const [owner, repo] = process.env.TARGET_REPOSITORY.split('/');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: Number(process.env.TARGET_PR),
              body: `Codjiflo Reviewer preparation failed; **no review verdict was submitted**. Review prerequisite preparation failed. [Workflow logs](${runUrl})`,
            });
      - name: Review pull request
        id: review
        shell: bash
        run: node bin/codjiflo-reviewer.mjs --repo "$REPOSITORY" --comment "$COMMENT_ID" --output "$RUNNER_TEMP/codjiflo-result-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
        env:
          REPOSITORY: ${{ inputs.repository }}
          COMMENT_ID: ${{ inputs.comment-id }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          CODJIFLO_APPROVED_USERS: ${{ vars.CODJIFLO_APPROVED_USERS }}
          CODJIFLO_OPUS_MODEL: ${{ vars.CODJIFLO_OPUS_MODEL }}
          CODJIFLO_SOURCE_SUBMODULES: ${{ needs.gate.outputs.source-submodules }}
          CODJIFLO_LOG_STREAM: ${{ needs.gate.outputs.visibility == 'public' && 'live' || 'withheld' }}
      # Artifacts of this public repository are public: retain public reviews only.
      - name: Retain review result
        id: artifact
        if: always() && needs.gate.outputs.visibility == 'public'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: codjiflo-review-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codjiflo-result-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: ignore
      - name: Warn when review result retention fails
        if: always() && steps.artifact.outcome == 'failure'
        shell: bash
        run: echo "::warning::Review result artifact upload failed; this does not change the review publication outcome. Check the retention step logs. actions/upload-artifact@v4 is not supported on GitHub Enterprise Server."
  report_failure:
    needs: [gate, review]
    # This must not depend on the self-hosted runner or its post-job steps.
    if: always() && needs.gate.outputs.allowed == 'true' && (needs.review.result == 'failure' || needs.review.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      # Read this attempt's job steps; dispatch one retry after a lost runner.
      actions: write
    steps:
      - name: Mint GitHub App installation token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CODJIFLO_APP_ID }}
          private-key: ${{ secrets.CODJIFLO_APP_PRIVATE_KEY }}
          owner: ${{ needs.gate.outputs.owner }}
          repositories: ${{ needs.gate.outputs.name }}
          permission-pull-requests: write
      - name: Read attempt start time
        id: attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --jq '"started-at=\(.run_started_at)\ncreated-at=\(.created_at)"' >> "$GITHUB_OUTPUT"
      - name: Report unsuccessful review job
        uses: actions/github-script@v9
        env:
          REVIEW_JOB_RESULT: ${{ needs.review.result }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_PR: ${{ needs.gate.outputs.number }}
          COMMENT_ID: ${{ inputs.comment-id }}
          REDISPATCH_OF: ${{ inputs.redispatch-of }}
          WORKFLOW_REF: ${{ github.ref_name }}
          ATTEMPT_STARTED_AT: ${{ steps.attempt.outputs.started-at }}
          RUN_CREATED_AT: ${{ steps.attempt.outputs.created-at }}
          ACTIONS_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            // Read the attempt from the environment; the toolkit context does not expose it.
            const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            if (!Number.isSafeInteger(runAttempt) || runAttempt < 1) {
              throw new Error('GITHUB_RUN_ATTEMPT must be a positive safe integer');
            }
            for (const name of ['ATTEMPT_STARTED_AT', 'RUN_CREATED_AT']) {
              if (Number.isNaN(Date.parse(process.env[name]))) throw new Error(`${name} must be a timestamp`);
            }
            // The run lives in this repository; the PR lives in the reviewed one.
            const [owner, repo] = process.env.TARGET_REPOSITORY.split('/');
            const number = Number(process.env.TARGET_PR);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = `<!-- codjiflo-job-failure:${context.runId}:${runAttempt} -->`;
            const workflowMarker = `<!-- codjiflo-workflow:${context.runId}:${runAttempt} -->`;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: number, per_page: 100,
            });
            if (reviews.some(review => review.user?.type === 'Bot' &&
              ['APPROVED', 'CHANGES_REQUESTED', 'COMMENTED'].includes(review.state) &&
              review.body?.includes(workflowMarker))) return;
            // Since run creation, not attempt start: retry notices of earlier attempts count too.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number,
              since: process.env.RUN_CREATED_AT, per_page: 100,
            });
            const attemptStartedAt = Date.parse(process.env.ATTEMPT_STARTED_AT);
            // An ordinary CLI/setup failure already has a useful diagnostic. If
            // the runner disappeared or its POST failed, this hosted job fills in.
            const reported = comments.some(comment => comment.user?.type === 'Bot' && Date.parse(comment.created_at) >= attemptStartedAt && (
              comment.body?.includes(marker) ||
              (comment.body?.includes(`[Workflow logs](${runUrl})`) &&
                /Codjiflo Reviewer (?:failed;|preparation failed;)/.test(comment.body))
            ));
            if (reported) return;
            const retryMarker = `<!-- codjiflo-retry:${context.runId} -->`;
            // 'queued': a fresh or still-pending retry; 'spent': this run's one retry already ran.
            const retryLostReview = async () => {
              // The App token only reaches the reviewed repository; this run's
              // jobs and dispatches live here.
              const actions = getOctokit(process.env.ACTIONS_TOKEN);
              const here = { owner: context.repo.owner, repo: context.repo.repo };
              const jobs = await actions.paginate(actions.rest.actions.listJobsForWorkflowRunAttempt, {
                ...here, run_id: context.runId, attempt_number: runAttempt, per_page: 100,
              });
              // A runner that vanishes mid-step leaves that step in_progress on a
              // completed job; failures the runner observes conclude every step.
              // The job has no `name:`, so the API names it by its id.
              if (!jobs.some(job => job.name === 'review' && job.steps?.some(step => step.status === 'in_progress'))) return { state: 'none' };
              // Once per run across attempts. An earlier attempt's retry was created
              // before this attempt started; its run-name names this run.
              const runs = await actions.paginate(actions.rest.actions.listWorkflowRuns, {
                ...here, workflow_id: 'review.yml', event: 'workflow_dispatch',
                created: `${process.env.RUN_CREATED_AT}..${process.env.ATTEMPT_STARTED_AT}`, per_page: 100,
              });
              const earlier = runs.find(run => run.display_title?.endsWith(`(retry of run ${context.runId})`));
              if (earlier) return { state: earlier.status === 'completed' ? 'spent' : 'queued', url: earlier.html_url };
              if (comments.some(comment => comment.user?.type === 'Bot' && comment.body?.includes(retryMarker))) return { state: 'spent' };
              // A newer review request supersedes this generation; the retry's gate
              // checks that with the command grammar before joining the PR's queue.
              await actions.rest.actions.createWorkflowDispatch({
                ...here, workflow_id: 'review.yml', ref: process.env.WORKFLOW_REF,
                inputs: {
                  repository: process.env.TARGET_REPOSITORY,
                  'comment-id': process.env.COMMENT_ID,
                  'redispatch-of': String(context.runId),
                },
              });
              return { state: 'queued' };
            };
            // Only a failure can be a lost runner; a retry that loses its runner only reports.
            let retry = { state: 'none' };
            if (process.env.REVIEW_JOB_RESULT === 'failure' && !process.env.REDISPATCH_OF) {
              // The PR notice is this job's contract: a retry error must not suppress it.
              retry = await retryLostReview().catch(error => {
                core.warning(`Lost-runner retry skipped: ${error.message}`);
                return { state: 'none' };
              });
            }
            const retryRun = retry.url ? ` [Retry run](${retry.url})` : '';
            const body = {
              queued: `Codjiflo Reviewer lost its runner mid-review and found no verdict from this attempt. The review was queued again automatically (one retry per run); its result will follow unless a newer review request supersedes it.${retryRun} [Workflow logs](${runUrl})\n\n${retryMarker}`,
              spent: `Codjiflo Reviewer lost its runner mid-review and found no verdict from this attempt. This run's one automatic retry already ran; re-request the review if it is still needed.${retryRun} [Workflow logs](${runUrl})`,
              none: `Codjiflo Reviewer job ended with status **${process.env.REVIEW_JOB_RESULT}**. The review runner did not confirm a failure report for this attempt. A runner interruption can prevent logs and post-job steps from being uploaded. Check existing PR reviews before retrying: this notification does not establish whether a verdict was submitted. [Workflow logs](${runUrl})`,
            }[retry.state];
            await github.rest.issues.createComment({
              owner, repo,
              issue_number: number,
              body: `${body}\n\n${marker}`,
            });
