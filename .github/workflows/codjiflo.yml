name: Review on mention
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  review:
    if: github.event.issue.pull_request
    uses: ./.github/workflows/review.yml
    with:
      approved-users: ${{ vars.CODJIFLO_APPROVED_USERS }}
      bot-ref: ${{ github.sha }}
      runner-label: codjiflo-reviewer
      app-id: ${{ vars.CODJIFLO_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.CODJIFLO_APP_PRIVATE_KEY }}
