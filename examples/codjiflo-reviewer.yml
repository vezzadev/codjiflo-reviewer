# Copy to .github/workflows/codjiflo-reviewer.yml on your DEFAULT branch.
name: Review on mention
on:
  issue_comment:
    types: [created]
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
jobs:
  review:
    if: github.event.issue.pull_request
    # Do not add caller/workflow concurrency: the reusable workflow queues only
    # requests that pass its authorization gate, not unrelated PR comments.
    # Pin both this reference and bot-ref to the SAME trusted release commit SHA.
    uses: vezzadev/codjiflo-reviewer/.github/workflows/review.yml@main
    with:
      approved-users: ${{ vars.CODJIFLO_APPROVED_USERS }}
      bot-ref: main
      runner-label: self-hosted
      # Optional for SolidWorks repositories; provision docs before OMP starts.
      # prepare-command: node scripts/prepare-solidworks-docs.mjs
      # Optional source-only dependencies; other submodules stay uninitialized.
      # source-submodules: '["SolidworksMCP-python"]'
      # Optional: register/install an App and set variable + secret as in README.
      app-id: ${{ vars.CODJIFLO_APP_ID }}
    secrets:
      app-private-key: ${{ secrets.CODJIFLO_APP_PRIVATE_KEY }}
